<html>
    <head>
        <title>HTML5:Place holder</title>
    </head>
    <body>
        <form action="#">
            FirstName: <input type="text" placeholder="Enter your first name" name="firstname" autofocus/><br><br>
            LastName: <input type="text" placeholder="Enter your last name" name="lastname" /><br><br>
            Contact number: <input type="number" placeholder="Enter your contact number" name="contact number"/><br><br>
            Email Id: <input type="email" placeholder="Enter your email id" name="mymail" id="emailid" /><br><br>

            <input type="submit"/>
        </form>
    </body>
</html>
