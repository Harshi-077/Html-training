
<html>
<head>
    <title>Datalist Example</title>
</head>
<body>

    <label>Choose your browser:</label>

    <input list="browsers" name="browser">

    <datalist id="browsers">
        <option value="Google Chrome">
        <option value="Mozilla Firefox">
        <option value="Microsoft Edge">
        <option value="Safari">
        <option value="Opera">
    </datalist>

</body>
</html>
